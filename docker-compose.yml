services:
  appliance-watch:
    build: .
    image: appliance-watch:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./devices.json:/app/devices.json:ro
    environment:
      - DEVICES_FILE=/app/devices.json
      - NTFY_ENABLED=${NTFY_ENABLED:-true}
    ports:
      - "8866:8080"
